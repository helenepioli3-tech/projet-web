<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo ENI</title>
    <link rel ="stylesheet" href ="style.css">
</head>
<body>
     <header class="entete">
        <div class ="logo-titre">
        <img src ="logo.png" alt ="Logo ENI">
        <h1 id="nomPromo"></h1>
    </div>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="preferences.html">Préférences</a>
        <a href="carte.html">Carte</a>
        <a href="informations.html">Informations</a>
    </nav>
    </header>

    <main class ="conteneur-preferences">
        <h2>Préférences du site</h2>
        <form>
        <div class="groupe-formulaire">
        <!--Choix du thème -->
            <label for="theme" class="libelle">Thème du site</label>
            <select id="theme" name="theme">
                <option value="clair">Clair</option>
                <option value="sombre">Sombre</option>
            </select>
        </div>
        <!--Choix format d'affichage-->
        <div class="groupe-formulaire format-affichage">
            <p class="libelle">Format d'affichage de la liste des apprenants</p>
            <div class="option-radio">
                <label>
                    <input type="radio" name="format" value="liste" checked>
                    Liste (Table)
                </label>
                <label>
                    <input type="radio" name="format" value="cartes">
                    Cartes (Grid)
                </label>
            </div>
        </div>
        <!--Boutons en bas-->
        <div class="conteneur-bouton-preferences">
            <a href="index.html" class="btn-retour">Retour à la page d'Accueil</a>
            <button type="submit">Enregistrer</button>
        </div>
        </form>
    </main>
<script src="preferences.js"></script>
<script src="theme.js"></script>
    
</body>
</html>
